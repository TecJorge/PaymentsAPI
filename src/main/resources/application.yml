spring:
  application:
    name: payments-api

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=Payments_API;encrypt=false;trustServerCertificate=true
    username: admin
    password: admin
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    hikari:
      connection-timeout: 5000
      minimum-idle: 1

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        default_schema: dbo
        generate_statistics: false
